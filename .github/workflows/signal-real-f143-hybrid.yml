name: Signal F143 Real Hybrid Conversion

on:
  workflow_dispatch:
  push:
    paths:
      - 'Signal_AndroidTV_Checkpoint_*.zip'

permissions:
  contents: read

jobs:
  real-f143-hybrid:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Select latest F143 checkpoint
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 2 -name 'Signal_AndroidTV_Checkpoint_*.zip' -type f | sort -V | tail -1)"
          test -n "$ZIP"
          echo "CHECKPOINT_ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "Selected $ZIP"

      - name: Extract original Swift source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p checkpoint skip-hybrid-results
          unzip -oq "$CHECKPOINT_ZIP" -d checkpoint
          test -s checkpoint/tools/real_f143_hybrid_gate.py
          test -s checkpoint/reference/apple-original/Sources/UnitySurfaceSystem.swift

      - name: Install Skip and native Swift Android SDK
        shell: bash
        run: |
          set -euo pipefail
          brew install skip
          swiftly init --skip-install --assume-yes --quiet-shell-followup
          skip android sdk install 2>&1 | tee skip-hybrid-results/native-sdk.txt

      - name: Record Skip environment diagnostics (not a compilation gate)
        shell: bash
        run: |
          set +e
          skip version > skip-hybrid-results/skip-version.txt 2>&1
          skip doctor --native > skip-hybrid-results/doctor-native.txt 2>&1
          echo "$?" > skip-hybrid-results/doctor-native.exit
          # skip checkup --native compiles an unrelated SkipFuseUI sample, which currently fails
          # in third-party Button.swift before real Signal modules are examined.
          # Always run both real Signal module tests independently below.

      - name: Create real Lite and Fuse source projects
        shell: bash
        run: |
          set -euo pipefail
          skip init --no-build --transpiled-model signal-unity-lite SignalUnityLite 2>&1 | tee skip-hybrid-results/init-lite.txt
          skip init --no-build --native-model signal-player-fuse SignalPlayerFuse 2>&1 | tee skip-hybrid-results/init-fuse.txt
          python3 checkpoint/tools/real_f143_hybrid_gate.py --checkpoint-root checkpoint --lite-project signal-unity-lite --fuse-project signal-player-fuse --diagnostics skip-hybrid-results

      - name: Compile and export original F143 Unity module with Skip Lite
        id: lite
        shell: bash
        run: |
          set +e
          mkdir -p skip-hybrid-results/lite-export
          (cd signal-unity-lite && skip export --debug --dir "$GITHUB_WORKSPACE/skip-hybrid-results/lite-export") > skip-hybrid-results/lite-build.txt 2>&1
          result=$?
          tail -n 120 skip-hybrid-results/lite-build.txt
          echo "$result" > skip-hybrid-results/lite-exit.txt
          echo "result=$result" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Compile and export original F143 Swift module with Skip Fuse
        id: fuse
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p skip-hybrid-results/fuse-export
          if [ -d signal-player-fuse ]; then
            (cd signal-player-fuse && skip export --debug --dir "$GITHUB_WORKSPACE/skip-hybrid-results/fuse-export") > skip-hybrid-results/fuse-build.txt 2>&1
            result=$?
          else
            echo "Fuse project was not created" > skip-hybrid-results/fuse-build.txt
            result=99
          fi
          tail -n 120 skip-hybrid-results/fuse-build.txt
          echo "$result" > skip-hybrid-results/fuse-exit.txt
          echo "result=$result" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Capture actual converted outputs and detailed build evidence
        if: always()
        shell: bash
        run: |
          mkdir -p skip-hybrid-results
          find signal-unity-lite signal-player-fuse skip-hybrid-results/lite-export skip-hybrid-results/fuse-export \\
            -type f \\( -name '*.kt' -o -name '*.java' -o -name '*.so' -o -name '*.aar' \\) -print > skip-hybrid-results/output-index.txt 2>/dev/null || true
          find signal-unity-lite/.build signal-player-fuse/.build -type f \\( -name '*.kt' -o -name '*.java' -o -name '*.so' -o -name '*.aar' \\) -print >> skip-hybrid-results/output-index.txt 2>/dev/null || true
          sort -u skip-hybrid-results/output-index.txt -o skip-hybrid-results/output-index.txt
          cat > skip-hybrid-results/README.txt <<'EOF'
          REAL F143 source compilation gate, not a verification-only test.
          Lite attempts skip export to transpile original UnitySurfaceSystem.swift and AppTab.swift.
          Fuse attempts skip export to compile original SignalUpNextDismissalState.swift.
          Zero exit codes and nonempty exports are prerequisites before app integration.
          This workflow does not create a full Signal Android APK.
          EOF
          echo "Export and build outputs:"
          cat skip-hybrid-results/output-index.txt

      - name: Upload conversion diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Signal-F143-Real-Skip-Hybrid-Results
          path: skip-hybrid-results/
          if-no-files-found: error

      - name: Fail if real Signal module verification failed
        if: always()
        shell: bash
        run: |
          if [ ! -s skip-hybrid-results/lite-exit.txt ] || [ ! -s skip-hybrid-results/fuse-exit.txt ]; then
            echo "One or both original Swift compilation attempts were not reached"
            exit 1
          fi
          lite="$(cat skip-hybrid-results/lite-exit.txt)"
          fuse="$(cat skip-hybrid-results/fuse-exit.txt)"
          echo "Real F143 Lite exit code: $lite"
          echo "Real F143 Fuse exit code: $fuse"
          test "$lite" = 0 && test "$fuse" = 0
