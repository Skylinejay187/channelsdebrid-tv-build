name: Signal F143 compatibility source audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/signal-f143-usenet-source-audit.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract compiler-blocking source files without changing archive
        run: |
          python3 - <<'PY'
          import zipfile, pathlib, hashlib
          p = pathlib.Path("Signal_F143_DISC_TICKET_EPG_Fuse_Android_Conversion.zip")
          names = {"UnityAppCore.swift", "SignalSearchGlyph.swift", "SignalSearchSpotlight.swift", "SignalSportsOnlinePlayer.swift", "SignalTopMenuVisuals.swift", "SignalNativeUsenet.swift"}
          out = pathlib.Path("compatibility-source")
          out.mkdir()
          with zipfile.ZipFile(p) as z:
              for name in sorted(names):
                  matches = [n for n in z.namelist() if n == "reference/apple-original/Sources/" + name]
                  assert len(matches) == 1, (name, matches)
                  data = z.read(matches[0])
                  (out / name).write_bytes(data)
                  print(name, hashlib.sha256(data).hexdigest(), flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Signal-F143-Compatibility-Source
          path: compatibility-source/
          if-no-files-found: error
