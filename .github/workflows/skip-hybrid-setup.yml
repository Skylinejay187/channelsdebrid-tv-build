name: Install Skip Hybrid (macOS)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-and-verify-hybrid:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out Signal repository
        uses: actions/checkout@v4

      - name: Install Skip
        shell: bash
        run: |
          set -euo pipefail
          brew install skip

      - name: Initialize Swiftly for CI
        shell: bash
        run: |
          set -euo pipefail
          swiftly init --skip-install --assume-yes --quiet-shell-followup
          swiftly --version
          swift --version
          
      - name: Verify Skip Lite tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p skip-hybrid-diagnostics
          skip version 2>&1 | tee skip-hybrid-diagnostics/skip-version.txt
          skip doctor 2>&1 | tee skip-hybrid-diagnostics/lite-doctor.txt

      - name: Install Swift Android SDK for Skip Fuse
        shell: bash
        run: |
          set -o pipefail
          skip android sdk install 2>&1 | tee skip-hybrid-diagnostics/android-sdk-install.txt

      - name: Verify Hybrid prerequisites
        shell: bash
        run: |
          set -o pipefail
          skip doctor --native 2>&1 | tee skip-hybrid-diagnostics/native-doctor.txt

      - name: Record exact scope
        if: always()
        shell: bash
        run: |
          mkdir -p skip-hybrid-diagnostics
          cat > skip-hybrid-diagnostics/README.txt <<'EOF'
          Installs Skip CLI and native Swift Android SDK on a temporary GitHub-hosted Mac.
          Verifies prerequisites for Skip Lite and Fuse on that runner.
          This does not install Skip permanently on UGREEN.
          This does not yet build the Signal app or claim Swift UI parity.
          The prior original-Swift Unity gate is a separate workflow.
          EOF

      - name: Publish diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Signal-Skip-Hybrid-Setup-Diagnostics
          path: skip-hybrid-diagnostics/
          if-no-files-found: warn
