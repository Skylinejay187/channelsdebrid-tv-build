name: Signal F143 Full-Source Skip Fuse Android App

on:
  workflow_dispatch:
    inputs:
      source_zip:
        description: F143 full-source ZIP in the repository root
        required: false
        default: Signal_F143_DISC_TICKET_EPG_Fuse_Android_Conversion.zip
        type: string
      runner:
        description: GitHub macOS runner pool (use another if one is unavailable)
        required: false
        default: macos-15-intel
        type: choice
        options:
          - macos-15-intel
          - macos-26-intel
          - macos-latest
  push:
    branches: [main, master]
    paths:
      - 'Signal_F143_DISC_TICKET_EPG_Fuse_Android_Conversion*.zip'
      - '.github/workflows/signal-f143-whole-app-fuse.yml'
      - '.github/scripts/f143_skip_visibility_bridge.py'
      - '.github/scripts/f143_wire_unity_root.py'
      - '.github/scripts/f143_android_apple_framework_guard.py'
      - '.github/scripts/f143_android_native_import_guard.py'
      - '.github/scripts/f143_android_catalog_framework_bridge.py'
      - '.github/scripts/f143_platform_import_audit.py'
      - '.github/scripts/f143_skip_fuse_ui_button_bridge.py'

permissions:
  contents: read

concurrency:
  group: signal-f143-fuse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  convert-f143-app:
    name: Compile original F143 SwiftUI app for Android
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 180

    steps:
      - name: Checkout uploaded source archive
        uses: actions/checkout@v4

      - name: Set up Java 17 for Android build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up compatible Gradle for Skip Android Gradle Plugin 9.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Verify actual Gradle version before full source compilation
        shell: bash
        run: |
          set -euo pipefail
          gradle --version | tee "$RUNNER_TEMP/gradle-version.txt"
          python3 - <<'PY'
          import re
          import subprocess
          raw = subprocess.check_output(["gradle", "--version"], text=True)
          match = re.search(r"(?m)^Gradle\s+(\d+)\.(\d+)(?:\.(\d+))?", raw)
          if match is None:
              raise SystemExit(f"Could not determine active Gradle version:\n{raw}")
          version = tuple(int(x or 0) for x in match.groups())
          if version < (9, 4, 1):
              raise SystemExit(f"Skip Android AGP requires Gradle >=9.4.1, got {version}")
          print(f"Verified compatible Gradle version {version}")
          PY

      - name: Locate and validate F143 archive
        shell: bash
        env:
          REQUESTED_ZIP: ${{ inputs.source_zip || 'Signal_F143_DISC_TICKET_EPG_Fuse_Android_Conversion.zip' }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/f143-fuse-results" "$GITHUB_WORKSPACE/f143-fuse-export"
          SOURCE_ZIP="$REQUESTED_ZIP"
          if [ ! -f "$SOURCE_ZIP" ]; then
            SOURCE_ZIP="$(find . -maxdepth 1 -type f -name 'Signal_F143_DISC_TICKET_EPG_Fuse_Android_Conversion*.zip' | sort | tail -n 1)"
          fi
          if [ -z "$SOURCE_ZIP" ] || [ ! -s "$SOURCE_ZIP" ]; then
            echo "::error::Upload Signal_F143_DISC_TICKET_EPG_Fuse_Android_Conversion.zip to the repository root."
            exit 1
          fi
          unzip -tq "$SOURCE_ZIP" > f143-fuse-results/zip-integrity.txt
          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"
          echo "CHECKPOINT_DIR=$GITHUB_WORKSPACE/f143-checkpoint" >> "$GITHUB_ENV"
          echo "RESULTS_DIR=$GITHUB_WORKSPACE/f143-fuse-results" >> "$GITHUB_ENV"
          echo "EXPORT_DIR=$GITHUB_WORKSPACE/f143-fuse-export" >> "$GITHUB_ENV"
          echo "Using source ZIP: $SOURCE_ZIP"

      - name: Extract and check every original F143 production source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CHECKPOINT_DIR"
          unzip -oq "$SOURCE_ZIP" -d "$CHECKPOINT_DIR"
          test -s "$CHECKPOINT_DIR/reference/apple-original/Sources/DebridChannelsTVOSApp.swift"
          test -s "$CHECKPOINT_DIR/reference/apple-original/Sources/UnitySurfaceSystem.swift"
          test -s "$CHECKPOINT_DIR/reference/apple-original-manifest.json"
          test -s "$CHECKPOINT_DIR/tools/full_f143_source_gate.py"
          test -s "$CHECKPOINT_DIR/tools/full_f143_fuse_compile.py"
          python3 "$CHECKPOINT_DIR/tools/full_f143_source_gate.py" \
            --root "$CHECKPOINT_DIR/reference/apple-original/Sources" \
            --output "$RESULTS_DIR/source-inventory" | tee "$RESULTS_DIR/source-check.txt"

      - name: Install Skip and native Swift Android SDK
        shell: bash
        run: |
          set -euo pipefail
          brew install skip
          # GitHub's Homebrew bottle was Skip 1.9.7 even though skip upgrade
          # reported 1.9.21. The latter did not replace the CLI on PATH.
          # Install the official Skip GitHub release directly, and enforce
          # the actual executable version before spending runner minutes.
          skip version > "$RESULTS_DIR/skip-version-before.txt" 2>&1
          SKIP_RELEASE=1.9.21
          SKIP_BIN_DIR="$RUNNER_TEMP/skip-release/skip.artifactbundle/bin"
          mkdir -p "$RUNNER_TEMP/skip-release"
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/skiptools/skip/releases/download/${SKIP_RELEASE}/skip-macos.zip" \
            --output "$RUNNER_TEMP/skip-release.zip"
          unzip -oq "$RUNNER_TEMP/skip-release.zip" -d "$RUNNER_TEMP/skip-release"
          test -x "$SKIP_BIN_DIR/skip" || chmod +x "$SKIP_BIN_DIR/skip"
          test -x "$SKIP_BIN_DIR/skip"
          echo "$SKIP_BIN_DIR" >> "$GITHUB_PATH"
          export PATH="$SKIP_BIN_DIR:$PATH"
          hash -r
          type -a skip > "$RESULTS_DIR/skip-cli-paths.txt"
          skip version 2>&1 | tee "$RESULTS_DIR/skip-version.txt"
          python3 -c 'import os,re,subprocess,sys; v=subprocess.check_output(["skip","version"],text=True); m=re.search(r"\b(\d+)\.(\d+)\.(\d+)\b",v); assert m and tuple(map(int,m.groups())) >= (1,9,21), f"Skip CLI remained stale: {v.strip()}"'
          swiftly init --skip-install --assume-yes --quiet-shell-followup
          skip android sdk install 2>&1 | tee "$RESULTS_DIR/android-sdk-install.txt"
          # Avoid gating on skip checkup's unrelated sample app.
          skip doctor --native > "$RESULTS_DIR/skip-doctor.txt" 2>&1 || true

      - name: Create real Skip Fuse APPLICATION (not native-model library)
        shell: bash
        run: |
          set -euo pipefail
          skip init --no-build --native-app \
            --appid=com.debridchannels.signal \
            signal-f143-fuse SignalF143Fuse 2>&1 | tee "$RESULTS_DIR/skip-init-app.txt"
          test -d signal-f143-fuse/Android
          test -d signal-f143-fuse/Sources/SignalF143Fuse
          test -f signal-f143-fuse/Skip.env
          find signal-f143-fuse -maxdepth 3 -type f | sort > "$RESULTS_DIR/created-app-files.txt"

      - name: Add the complete original F143 Swift production sources
        shell: bash
        run: |
          set -euo pipefail
          python3 "$CHECKPOINT_DIR/tools/full_f143_fuse_compile.py" \
            --checkpoint-root "$CHECKPOINT_DIR" \
            --skip-project signal-f143-fuse \
            --diagnostics "$RESULTS_DIR" | tee "$RESULTS_DIR/staging.txt"
          test -s signal-f143-fuse/Sources/SignalF143Fuse/F143Original/DebridChannelsTVOSApp.swift
          test -s signal-f143-fuse/Sources/SignalF143Fuse/F143Original/UnitySurfaceSystem.swift

      - name: Inventory all Apple-only framework imports before Android compilation
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/f143_platform_import_audit.py \
            --source-root signal-f143-fuse/Sources/SignalF143Fuse/F143Original \
            --report-dir "$RESULTS_DIR"
          test -s "$RESULTS_DIR/platform-import-inventory.csv"
          test -s "$RESULTS_DIR/platform-import-summary.json"
          python3 - "$RESULTS_DIR/platform-import-summary.json" <<'PY'
          import json,sys
          result=json.load(open(sys.argv[1]))
          print("Platform compatibility review:",result["files_requiring_platform_review"],"files;",result["flagged_imports"],"imports")
          PY

      - name: Wire real Signal F143 Unity RootView into Android app entry
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/f143_wire_unity_root.py \
            --skip-project signal-f143-fuse \
            --report "$RESULTS_DIR/unity-entry-wiring.json"
          test -s signal-f143-fuse/Sources/SignalF143Fuse/ContentView.swift
          grep -q 'RootView()' signal-f143-fuse/Sources/SignalF143Fuse/ContentView.swift
          grep -q 'environmentObject(unityCore)' signal-f143-fuse/Sources/SignalF143Fuse/ContentView.swift

      - name: Isolate Apple-only Aether UIView playback host from Android native Swift
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/f143_android_apple_framework_guard.py \
            --source-root signal-f143-fuse/Sources/SignalF143Fuse/F143Original \
            --report "$RESULTS_DIR/aether-apple-bridge-guard.json"
          test -s "$RESULTS_DIR/aether-apple-bridge-guard.json"
          head -n 1 signal-f143-fuse/Sources/SignalF143Fuse/F143Original/AetherPlaybackBridge/AetherPlaybackBridge.swift | grep -Fqx '#if !TARGET_OS_ANDROID'
          # Fail immediately if the Android Swift compilation guard does not
          # actually exclude UIKit/AetherEngine, rather than spending 40 minutes
          # compiling before discovering an unguarded Apple import.
          swiftc -D TARGET_OS_ANDROID -typecheck \
            signal-f143-fuse/Sources/SignalF143Fuse/F143Original/AetherPlaybackBridge/AetherPlaybackBridge.swift \
            > "$RESULTS_DIR/aether-android-guard-typecheck.txt" 2>&1
      - name: Guard Apple AetherEngine and Keychain imports in staged Swift sources
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/f143_android_native_import_guard.py \
            --source-root signal-f143-fuse/Sources/SignalF143Fuse/F143Original \
            --report "$RESULTS_DIR/apple-native-import-guards.json"
          test -s "$RESULTS_DIR/apple-native-import-guards.json"
          grep -Fq '#if canImport(AetherEngine) && canImport(UIKit)' \
            signal-f143-fuse/Sources/SignalF143Fuse/F143Original/AetherPlaybackBridge/AetherPlaybackBridge.swift
          grep -Fq '#if canImport(Security)' \
            signal-f143-fuse/Sources/SignalF143Fuse/F143Original/BackupStreamingClient.swift
          # Parsing checks declarations without pulling in Apple-only binaries.
          swiftc -frontend -parse \
            signal-f143-fuse/Sources/SignalF143Fuse/F143Original/AetherPlaybackBridge/AetherPlaybackBridge.swift \
            signal-f143-fuse/Sources/SignalF143Fuse/F143Original/BackupStreamingClient.swift \
            > "$RESULTS_DIR/native-import-guards-parse.txt" 2>&1

      - name: Guard TVServices Top Shelf and AVFoundation catalog validation
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/f143_android_catalog_framework_bridge.py \
            --source-root signal-f143-fuse/Sources/SignalF143Fuse/F143Original \
            --report "$RESULTS_DIR/android-catalog-import-guards.json"
          swiftc -frontend -parse \
            signal-f143-fuse/Sources/SignalF143Fuse/F143Original/CatalogStore.swift \
            signal-f143-fuse/Sources/SignalF143Fuse/F143Original/DebridChannelsTVOSApp.swift \
            > "$RESULTS_DIR/android-catalog-parse.txt" 2>&1
          test -s "$RESULTS_DIR/android-catalog-import-guards.json"

      - name: Apply nine proven F143 Skip bridge diagnostics before first full compile
        shell: bash
        run: |
          set -euo pipefail
          # Diagnostic text is copied from the 2026-11-22 actual Skip 1.9.21 compiler log.
          # Changes apply ONLY to staged runner files, never the uploaded F143 ZIP.
          cat > "$RESULTS_DIR/known-f143-visibility-errors.txt" <<'EOF'
          /staged/F143Original/Phase15FinalIntegration.swift:28:1: error: Private state property 'selectedSeason' cannot be bridged to Android
          /staged/F143Original/Phase15FinalIntegration.swift:28:1: error: Private state property 'preparedRows' cannot be bridged to Android
          /staged/F143Original/Phase15FinalIntegration.swift:28:1: error: Private state property 'preparedSeasons' cannot be bridged to Android
          /staged/F143Original/Phase15FinalIntegration.swift:246:1: error: Private views cannot be bridged to Android
          /staged/F143Original/Phase15FinalIntegration.swift:282:1: error: Private views cannot be bridged to Android
          /staged/F143Original/Phase15FinalIntegration.swift:452:1: error: Private state property 'closeFocused' cannot be bridged to Android
          /staged/F143Original/Phase15FinalIntegration.swift:551:1: error: Private views cannot be bridged to Android
          /staged/F143Original/Phase15FinalIntegration.swift:657:1: error: Private views cannot be bridged to Android
          /staged/F143Original/Phase15FinalIntegration.swift:690:1: error: Private state property 'focusedAction' cannot be bridged to Android
          EOF
          python3 .github/scripts/f143_skip_visibility_bridge.py \
            --log "$RESULTS_DIR/known-f143-visibility-errors.txt" \
            --source-root signal-f143-fuse/Sources/SignalF143Fuse/F143Original \
            --report "$RESULTS_DIR/known-f143-visibility-edits.json"
          edits=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["applied_change_count"])' "$RESULTS_DIR/known-f143-visibility-edits.json")
          test "$edits" -eq 13 || {
            echo "::error::Expected 13 verified bridge edits; got $edits. Inspect original code and fixture."
            exit 1
          }
          echo "Applied $edits source-grounded compatibility changes to temporary Swift files"

      - name: Prepare and patch locally checked out SkipFuseUI Button bridge
        shell: bash
        run: |
          set -euo pipefail
          swift package resolve --package-path signal-f143-fuse 2>&1 | tee "$RESULTS_DIR/swift-package-resolve.txt"
          python3 .github/scripts/f143_skip_fuse_ui_button_bridge.py \
            --project-root signal-f143-fuse \
            --report "$RESULTS_DIR/skip-fuse-ui-button-bridge.json"
          swiftc -frontend -parse signal-f143-fuse/.build/checkouts/skip-fuse-ui/Sources/SkipSwiftUI/Controls/Button.swift \
            > "$RESULTS_DIR/button-parse.txt" 2>&1
          test -s "$RESULTS_DIR/skip-fuse-ui-button-bridge.json"

      - name: Compile F143 and auto-repair only compiler-reported SwiftUI visibility blockers
        id: compile
        shell: bash
        run: |
          set +e
          compiled=1
          max_passes=40
          for pass in $(seq 1 "$max_passes"); do
            echo "::group::F143 full-source Skip Fuse compile attempt $pass of $max_passes"
            log="$RESULTS_DIR/whole-app-compile-attempt-$pass.txt"
            # Stream Gradle output to the Actions log in real time.
            # Keep the same complete evidence file and preserve Gradle's
            # original exit code (not tee's).
            (cd signal-f143-fuse && gradle -p Android assembleDebug --stacktrace --no-daemon --console=plain --info) 2>&1 | tee "$log"
            compiled=${PIPESTATUS[0]}
            cp "$log" "$RESULTS_DIR/whole-app-compile.txt"
            echo "$compiled" > "$RESULTS_DIR/whole-app-exit-code.txt"
            echo "Full-source direct Android Gradle build exit code: $compiled"
            echo "::endgroup::"
            if [ "$compiled" -eq 0 ]; then
              echo "Full-source Android Gradle build passed on attempt $pass"
              break
            fi
            # Platform/framework imports cannot be repaired by the SwiftUI
            # visibility-only patcher. Stop retrying immediately, so the next
            # actual incompatibility is visible instead of wasting a runner.
            if grep -Fq 'error: no such module' "$log"; then
              echo "::error::Native Swift Android dependency unavailable (not a visibility error)."
              grep -E "error: no such module" "$log" | sort -u | head -n 20
              echo "Stopping repeated compile attempts for a missing Swift module."
              break
            fi
            if [ "$pass" -eq "$max_passes" ]; then
              echo "::warning::Reached maximum diagnostic-driven patch attempts"
              break
            fi
            report="$RESULTS_DIR/visibility-patch-attempt-$pass.json"
            python3 .github/scripts/f143_skip_visibility_bridge.py \
              --log "$log" \
              --source-root signal-f143-fuse/Sources/SignalF143Fuse/F143Original \
              --report "$report"
            edits=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["applied_change_count"])' "$report")
            echo "Targeted compatibility edits: $edits"
            if [ "$edits" -eq 0 ]; then
              echo "No known safe automatic fixes remain; preserving real compiler failure"
              break
            fi
          done
          echo "exit_code=$compiled" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Extract actual compiler errors and find built APK
        if: always()
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/f143-fuse-results"
          if [ -f "$GITHUB_WORKSPACE/f143-fuse-results/whole-app-compile.txt" ]; then
            grep -nEi '(^|[[:space:]])error:|cannot find|no such module|failed|unsupported' \
              "$GITHUB_WORKSPACE/f143-fuse-results/whole-app-compile.txt" \
              | head -n 250 > "$GITHUB_WORKSPACE/f143-fuse-results/compiler-errors-first250.txt" || true
          fi
          find "$GITHUB_WORKSPACE/signal-f143-fuse/Android" "$GITHUB_WORKSPACE/signal-f143-fuse/.build/Android" \
            -type f \( -name '*.apk' -o -name '*.aab' \) -print \
            > "$GITHUB_WORKSPACE/f143-fuse-results/apk-paths.txt" 2>/dev/null || true
          {
            echo '## Signal F143 whole-application conversion'
            echo 'Original source is retained under F143Original. Direct Android Gradle build avoids the failing iOS IPA archive.'
            echo 'This workflow uses --native-app and directly invokes the generated Android Gradle project.'
            echo "Compile exit code: $(cat "$GITHUB_WORKSPACE/f143-fuse-results/whole-app-exit-code.txt" 2>/dev/null || echo NOT_REACHED)"
            echo '### APK paths (if any)'
            cat "$GITHUB_WORKSPACE/f143-fuse-results/apk-paths.txt"
            echo '### Skip bridge repair attempts'
            for report in "$GITHUB_WORKSPACE"/f143-fuse-results/visibility-patch-attempt-*.json; do
              if [ -f "$report" ]; then
                echo "- $(basename "$report"): $(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["applied_change_count"])' "$report") edits"
              fi
            done
            echo '### First compiler errors'
            head -n 40 "$GITHUB_WORKSPACE/f143-fuse-results/compiler-errors-first250.txt" 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve failure cause even if compilation never starts
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p "$GITHUB_WORKSPACE/f143-fuse-results"
          {
            echo "=== FULL-SOURCE SKIP F143 RUN ==="
            echo "GitHub run: $GITHUB_RUN_ID"
            echo "GitHub attempt: $GITHUB_RUN_ATTEMPT"
            echo "GitHub SHA: $GITHUB_SHA"
            echo "Runner OS: $RUNNER_OS"
            echo "Runner architecture: $RUNNER_ARCH"
            echo "Job status at diagnostic step: ${{ job.status }}"
            echo "=== TOOL VERSIONS ==="
            command -v skip || true
            skip version || true
            command -v gradle || true
            gradle --version | head -n 16 || true
            command -v swift || true
            swift --version || true
            echo "=== SOURCE AND RESULT FILES ==="
            find "$GITHUB_WORKSPACE/f143-fuse-results" -maxdepth 2 -type f -print | sort
            echo "=== RECENT COMPILER ERRORS ==="
            grep -Ei 'error:|FAILURE:|What went wrong:|no such module|could not|failed' \
              "$GITHUB_WORKSPACE/f143-fuse-results/whole-app-compile.txt" | tail -n 100 || true
            echo "=== APK CANDIDATES ==="
            find "$GITHUB_WORKSPACE/signal-f143-fuse" -name '*.apk' -print 2>/dev/null || true
          } > "$GITHUB_WORKSPACE/f143-fuse-results/run-summary.txt" 2>&1
          cat "$GITHUB_WORKSPACE/f143-fuse-results/run-summary.txt"
          {
            echo "### F143 full-source diagnostic capture"
            echo "Workflow job status: ${{ job.status }}"
            if [ -s "$GITHUB_WORKSPACE/f143-fuse-results/whole-app-exit-code.txt" ]; then
              echo "Android compiler exit: $(cat "$GITHUB_WORKSPACE/f143-fuse-results/whole-app-exit-code.txt")"
            else
              echo "Android compiler not reached. Check job steps before 'Compile F143'."
            fi
            echo "Diagnostic report: Signal-F143-Fuse-App-Compiler-Evidence artifact, run-summary.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full-source compiler evidence regardless of failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Signal-F143-Fuse-App-Compiler-Evidence
          path: f143-fuse-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Refuse placeholder Android APK before app artifact publication
        if: steps.compile.outputs.exit_code == '0'
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RESULTS_DIR/unity-entry-wiring.json"
          grep -q 'RootView()' signal-f143-fuse/Sources/SignalF143Fuse/ContentView.swift
          grep -q 'environmentObject(unityCore)' signal-f143-fuse/Sources/SignalF143Fuse/ContentView.swift
          echo 'APK compiled from original Signal F143 RootView entry.'

      - name: Upload new Skip Fuse Android APK only if genuinely built
        if: steps.compile.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: Signal-F143-Fuse-Android-APK
          path: |
            signal-f143-fuse/Android/**/*.apk
            signal-f143-fuse/.build/Android/**/*.apk
          if-no-files-found: error

      - name: Fail when original app did not compile
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s f143-fuse-results/whole-app-exit-code.txt || {
            echo "::error::The original application compilation was not reached. See compiler evidence artifact."
            exit 1
          }
          test "$(cat f143-fuse-results/whole-app-exit-code.txt)" = 0 || {
            echo "::error::Original F143 does not compile yet. Read compiler-errors-first250.txt."
            exit 1
          }
          test -s f143-fuse-results/apk-paths.txt || {
            echo "::error::Skip returned success but produced no Android APK."
            exit 1
          }
